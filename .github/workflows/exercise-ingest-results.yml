# Part of the daily exercise app (see docs/README.md), not handbook maintenance.
# Records practice results into docs/data/ — it never modifies handbook content.
name: Ingest exercise results

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: ingest-results
  cancel-in-progress: false

jobs:
  ingest:
    # Only act on result reports, and only from the repository owner — the issue
    # body drives what gets written into the study history.
    if: >
      contains(github.event.issue.labels.*.name, 'exercise-result') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Record results
        id: record
        env:
          # Passed through the environment, never interpolated into the shell:
          # the body is user-controlled text.
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPORTER: ${{ github.event.issue.user.login }}
        run: |
          set -o pipefail
          printf '%s' "$ISSUE_BODY" \
            | python3 exercise-generator/ingest_mistakes.py --reporter "$REPORTER" \
            | tee summary.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/data; then
            echo "No changes to commit."
            exit 0
          fi
          git add docs/data
          git commit -m "Record exercise results from issue #${{ github.event.issue.number }}"
          git push

      - name: Comment and close
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          {
            echo "已记录本次练习结果，错题会进入复习队列，明天的练习会优先出这些知识点。"
            echo
            echo '```'
            cat summary.txt
            echo '```'
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > comment.md
          gh issue comment "$ISSUE_NUMBER" --body-file comment.md
          gh issue close "$ISSUE_NUMBER"
