# Part of the daily exercise app (see docs/README.md), not handbook maintenance.
# Reads handbook/ and writes docs/data/ — it never modifies handbook content.
name: Daily exercises

on:
  schedule:
    # Midnight UTC. GitHub evaluates cron in UTC and ignores daylight saving,
    # so anchoring to UTC needs no seasonal correction: one expression, all year.
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to generate (YYYY-MM-DD, default: today in UTC)"
        required: false
      force:
        description: "Regenerate even if the file already exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-exercises
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check every item ID is accepted
        run: python3 exercise-generator/check_id_pattern.py

      - name: Generate today's exercises
        id: generate
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          DATE="$INPUT_DATE"
          if [ -z "$DATE" ]; then
            # Runner clocks are UTC, and at 00:00 UTC the UK calendar date is the
            # same either side of the DST boundary, so no conversion is needed.
            DATE="$(date -u +%F)"
          fi
          FORCE=""
          if [ "$INPUT_FORCE" = "true" ]; then
            FORCE="--force"
          fi
          echo "Generating exercises for $DATE"
          python3 exercise-generator/generate_exercises.py --date "$DATE" $FORCE
          # Hand the resolved date to the commit step, so a run for another date
          # is not labelled with today's.
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `git diff` only reports tracked files. The result logs start life
          # untracked, so checking with diff reported "no changes" and silently
          # dropped them. `git status --porcelain` sees untracked files too.
          if [ -z "$(git status --porcelain -- docs/data)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git add docs/data
          git commit -m "Add daily exercises for ${{ steps.generate.outputs.date }}"
          git push
